<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="estilo.css">
    <title>Projeto Autentificação</title>
</head>
<body>
    <header>
            <a href="index.html">
            <img src="imgs/logo (2).png" width="170" height="170" alt="Victor Projetos">
            </a>
            <h1>Projeto de Autentificação</h1>
    </header>
    <main>
        <form action="" class="card-cadastro"  method="post">
            <h1 class = "h1-criar-conta">Cadastra-se</h1>  
            <div class="campoCaEmail">
                <label for="CadastroEmail">Cadastrar Email</label>
                <input type="email" name="Cadastro-Email" id="Cadastro-Email" placeholder="Digite seu Email">
            </div>
            <div class="CampoCaSenha">
                <label for="Cadastro-Senha">Criar Senha</label>
                <input type="password" id="Cadastro-Senha" name="CadastroSenha" placeholder="Digite sua senha">            
            </div>
            <div class="CampoRepetirSenha">
                <label for="Repetir-Senha">Confirmar Senha</label>
                <input type="password" id="Repetir-Senha" name="Repetir-Senha"placeholder="Confirme sua senha">
            </div>
            <div class="CampoTelefone">
                <label for="Cadastro-Telefone">Telefone</label>
                <input type="tel" id="Cadastro-Telefone" name="Cadastro-Telefone" placeholder="Digite seu telefone">
            </div>
            <div class="CampoCep">
            <label for="Cep">CEP</label>
            <input type="number" id ="cep" name="cep"placeholder="Digite seu cep">
            </div>
            <div class="CampoRua">
            <label for="Rua">Rua</label>
            <input type="text"id="Rua"name="Rua">
            </div>
            <div class="casa-Numero">
                <label for="casa">Numero</label>
                <input type="text" id="casa" name="casa">
            </div>
            <button>Cadastrar</button>
            <div class="ja tenho conta">
                <p class="JatenhoConta"><a href="index.html">Ja tenho conta</a></p>
            </div>
        </form>
</main>
</body>
</html>
